<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTN Perfiles — Iniciar sesión</title>
  <link rel="stylesheet" href="css/modern-app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <img src="img/utn.jpg" alt="Logotipo UTN">
      <h1>UTN Perfiles</h1>
      <p>Gestión de usuarios, carreras y estudiantes</p>
    </div>

    <div id="login-error" class="alert alert-error" role="alert" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="user">Usuario</label>
        <input id="user" class="user" type="text" name="user_name" autocomplete="username" placeholder="Ej. admin" required>
      </div>

      <div class="field">
        <label for="exampleInputPassword2">Contraseña</label>
        <div class="password-wrap">
          <input id="exampleInputPassword2" class="pass" type="password" name="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
          <button id="toggle-pass" type="button" class="btn btn-secondary" aria-pressed="false" aria-label="Mostrar u ocultar contraseña">Ver</button>
        </div>
      </div>

      <button id="ok" class="btn btn-primary btn-block" type="submit">Ingresar</button>
    </form>

    <div class="alert alert-info">
      Acceso predeterminado: <strong>admin</strong> / <strong>12345</strong> (también funcionan los usuarios creados en el panel).
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
