<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTN Perfiles — Panel de Gestión</title>
  <link rel="stylesheet" href="css/modern-app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <img src="img/utn.jpg" alt="Logotipo UTN">
        <h1>UTN Perfiles</h1>
      </div>
      <div class="topbar-user">
        <span id="session-label">Sesión: Administrador</span>
        <button id="logout-btn" type="button" class="btn btn-logout">Salir</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <nav class="tabs-nav" role="tablist" aria-label="Secciones de UTN Perfiles">
      <button id="tab-btn-0" class="tab-btn" role="tab" aria-selected="true" aria-controls="tabs-0" data-tab="0" type="button">
        Dashboard
      </button>
      <button id="tab-btn-1" class="tab-btn" role="tab" aria-selected="false" aria-controls="tabs-1" data-tab="1" type="button">
        Usuarios <span id="count-users" class="badge-count">0</span>
      </button>
      <button id="tab-btn-2" class="tab-btn" role="tab" aria-selected="false" aria-controls="tabs-2" data-tab="2" type="button">
        Carreras <span id="count-careers" class="badge-count">0</span>
      </button>
      <button id="tab-btn-3" class="tab-btn" role="tab" aria-selected="false" aria-controls="tabs-3" data-tab="3" type="button">
        Estudiantes <span id="count-students" class="badge-count">0</span>
      </button>
    </nav>

    <section id="tabs-0" class="card" role="tabpanel" aria-labelledby="tab-btn-0">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Usuarios</div>
          <div id="kpi-users" class="kpi-value">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Carreras</div>
          <div id="kpi-careers" class="kpi-value">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Estudiantes</div>
          <div id="kpi-students" class="kpi-value">0</div>
        </div>
      </div>

      <form id="global-search-form" class="search-bar" role="search">
        <input id="global-search-input" type="search" placeholder="Buscar estudiantes, carreras, usuarios o habilidades (ej. JavaScript, PHP)..." aria-label="Buscar en todos los registros">
        <button type="submit" class="btn btn-primary">Buscar</button>
        <button id="global-search-clear" type="button" class="btn btn-secondary">Limpiar</button>
      </form>

      <div>
        <strong>Últimas búsquedas realizadas:</strong>
        <div id="recent-searches" class="chips" aria-label="Historial de búsquedas"></div>
      </div>

      <div id="search-results" aria-live="polite"></div>
    </section>

    <section id="tabs-1" class="card" role="tabpanel" aria-labelledby="tab-btn-1" hidden>
      <div class="toolbar">
        <div>
          <h2 style="margin:0;font-size:1.15rem;">Gestión de Usuarios</h2>
        </div>
        <div class="toolbar-actions">
          <button id="add1" type="button" class="btn btn-primary">+ Agregar</button>
          <button id="search1" type="button" class="btn btn-secondary" disabled>Ver detalle</button>
          <button id="edit1" type="button" class="btn btn-secondary" disabled>Editar</button>
          <button id="delete1" type="button" class="btn btn-danger" disabled>Eliminar</button>
        </div>
      </div>
      <div id="table_wrapper1" class="table-scroll"></div>
    </section>

    <section id="tabs-2" class="card" role="tabpanel" aria-labelledby="tab-btn-2" hidden>
      <div class="toolbar">
        <div>
          <h2 style="margin:0;font-size:1.15rem;">Gestión de Carreras</h2>
        </div>
        <div class="toolbar-actions">
          <button id="add2" type="button" class="btn btn-primary">+ Agregar</button>
          <button id="search2" type="button" class="btn btn-secondary" disabled>Ver detalle</button>
          <button id="edit2" type="button" class="btn btn-secondary" disabled>Editar</button>
          <button id="delete2" type="button" class="btn btn-danger" disabled>Eliminar</button>
        </div>
      </div>
      <div id="table_wrapper2" class="table-scroll"></div>
    </section>

    <section id="tabs-3" class="card" role="tabpanel" aria-labelledby="tab-btn-3" hidden>
      <div class="toolbar">
        <div>
          <h2 style="margin:0;font-size:1.15rem;">Gestión de Estudiantes</h2>
        </div>
        <div class="toolbar-actions">
          <button id="add3" type="button" class="btn btn-primary">+ Agregar</button>
          <button id="search3" type="button" class="btn btn-secondary" disabled>Ver detalle</button>
          <button id="edit3" type="button" class="btn btn-secondary" disabled>Editar</button>
          <button id="delete3" type="button" class="btn btn-danger" disabled>Eliminar</button>
        </div>
      </div>
      <div id="table_wrapper3" class="table-scroll"></div>
    </section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal-dialog" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Detalle</h2>
        <button id="modal-close-x" type="button" class="btn btn-secondary" aria-label="Cerrar diálogo">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
